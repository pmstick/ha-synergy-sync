name: Synergy Sync
version: "0.2.1"
slug: synergy_sync
url: https://github.com/pmstick/ha-synergy-sync
image: ghcr.io/pmstick/{arch}-ha-synergy-sync
description: Import Synergy (WA) half-hourly grid import and solar export into the Energy dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower
panel_title: Synergy Sync
homeassistant_api: true
stdin: true
options:
  service_id: ""
  initial_days: 90
  usage_rate_cents: 32.3719
  supply_charge_cents_per_day: 116.0505
  feed_in_peak_cents: 10.0
  feed_in_offpeak_cents: 2.0
schema:
  service_id: str?
  initial_days: int(1,730)
  usage_rate_cents: float(0,)
  supply_charge_cents_per_day: float(0,)
  feed_in_peak_cents: float(0,)
  feed_in_offpeak_cents: float(0,)
